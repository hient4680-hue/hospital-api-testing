name: Kiem thu tu dong Hospital API

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Cai Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cai dependencies
        run: npm install

      - name: Cai Newman
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra
          npm install -g nyc

      - name: Khoi dong server
        run: |
          nohup npm start > server.log 2>&1 &

          echo "Dang doi server khoi dong..."
          sleep 60

          echo "===== SERVER LOG ====="
          cat server.log

          echo "===== CHECK SERVER ====="
          curl http://localhost:3000 || exit 1
        env:
          PORT: 3000
          PRODUCTION: false

          SESSION_SECRET: codemagicianssessionsecret
          SESSION_TIME_OUT: 900000

          JWT_ACCESS_SECRET: jwtaceesssecret
          JWT_ACCESS_TIME_OUT: 15m

          JWT_REFRESH_SECRET: jwtrefreshsecret
          JWT_REFRESH_TIME_OUT: 1d

          CLIENT_URL: http://localhost:3000

          MONGODB_URI: mongodb+srv://thuhien:20012004@cluster0.hfbfgfp.mongodb.net/hospitalAPI?retryWrites=true&w=majority

      - name: Chay Newman API Test
        run: |
          newman run HospitalAPI_Collection.json \
          -e HospitalAPI_Environment.json \
          --reporters cli,htmlextra \
          --reporter-htmlextra-export BaoCao_Newman.html

      - name: Upload bao cao Newman
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-report
          path: BaoCao_Newman.html